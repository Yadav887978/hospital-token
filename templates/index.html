<!DOCTYPE html>
<html>
<head>
    <title>Hospital Token</title>
    <style>
        body { font-family: Arial; background: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; }
        h1 { color: #2e8b57; }
        input { padding: 10px; width: 250px; margin: 10px; border: 2px solid #2e8b57; border-radius: 5px; }
        button { padding: 12px 30px; background: #2e8b57; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #246b45; }
        .result { margin-top: 20px; font-size: 20px; color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🏥 Hospital Token System</h1>
        <form method="POST">
            <input type="text" name="name" placeholder="Apna naam likho" required><br>
            <button type="submit">Token Lo</button>
        </form>
        {% if token %}
        <div class="result">
            <h2>✅ Token Number: {{ token }}</h2>
            <p>📢 Aapke aage {{ waiting }} log hai</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
