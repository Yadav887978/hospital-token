<!DOCTYPE html>
<html>
<head>
<title>Maharashtra Govt Hospital Token</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {font-family:Arial; background:#f0f2f5; margin:0; padding:20px;}
.container {max-width:500px; margin:auto; background:white; padding:25px; border-radius:12px;}
h2 {text-align:center; color:#007bff;}
label {font-weight:bold; margin-top:15px; display:block;}
input, select {width:100%; padding:12px; margin-top:5px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;}
button {width:100%; padding:14px; background:#28a745; color:white; border:none; border-radius:8px; font-size:16px; margin-top:20px;}
.token-slip {text-align:center; padding:25px; border:2px dashed #007bff; border-radius:12px; margin-top:20px; background:#e7f3ff;}
.token-no {font-size:48px; font-weight:bold; color:#dc3545;}
</style>
</head>
<body>
<div class="container">
<h2>🏥 Maharashtra Govt Hospital Token</h2>

{% if not patient %}
<form method="post">

<label>Select Hospital:</label>
<select name="hospital" required>
<option value="">-- Hospital Chuno --</option>
<option value="JJ Hospital Mumbai">JJ Hospital Mumbai</option>
<option value="KEM Hospital Mumbai">KEM Hospital Mumbai</option>
<option value="Sion Hospital Mumbai">Sion Hospital Mumbai</option>
<option value="Sasoon Hospital Pune">Sasoon Hospital Pune</option>
<option value="GMCH Nagpur">GMCH Nagpur</option>
<!-- Baaki 45 hospital bhi yahi daal de jo pichle msg me bheje the -->
</select>

<label>Select Bimari / Disease:</label>
<select name="disease" id="disease" required>
<option value="">-- Bimari Chuno --</option>
<option value="Fever / Sardi Khasi">Fever / Sardi Khasi</option>
<option value="Heart / BP">Heart / BP</option>
<option value="Skin / Allergy">Skin / Allergy</option>
<option value="Ortho / Haddi">Ortho / Haddi</option>
<option value="Gynecology">Gynecology</option>
</select>

<label>OPD / Doctor Room:</label>
<select name="opd" id="opd" required>
<option value="">-- Pehle Bimari Chuno --</option>
<option value="OPD 101 - General Medicine" data-disease="Fever / Sardi Khasi">OPD 101 - General Medicine</option>
<option value="OPD 201 - Cardiology" data-disease="Heart / BP">OPD 201 - Cardiology</option>
<option value="OPD 301 - Dermatology" data-disease="Skin / Allergy">OPD 301 - Dermatology</option>
<option value="OPD 401 - Orthopedics" data-disease="Ortho / Haddi">OPD 401 - Orthopedics</option>
<option value="OPD 501 - Gynecology" data-disease="Gynecology">OPD 501 - Gynecology</option>
</select>

<label>Patient Name:</label>
<input type="text" name="patient_name" required>

<label>Address:</label>
<input type="text" name="address" required>

<input type="hidden" name="amount" value="30">

<button type="submit">🎫 Token Generate - Pay ₹30</button>
</form>

<script>
document.getElementById('disease').addEventListener('change', function() {
var disease = this.value;
var opdSelect = document.getElementById('opd');
for(var i=0; i<opdSelect.options.length; i++) {
opdSelect.options[i].style.display = 'none';
}
opdSelect.options[0].style.display = 'block';
for(var i=1; i<opdSelect.options.length; i++) {
if(opdSelect.options[i].getAttribute('data-disease') == disease) {
opdSelect.options[i].style.display = 'block';
opdSelect.value = opdSelect.options[i].value;
}
});
</script>

{% else %}
<div class="token-slip">
<div>Token Number</div>
<div class="token-no">#{{patient.id}}</div>
<div>{{patient.patient_name}}</div>
<div style="color:#007bff; font-weight:bold;">{{patient.hospital}}</div>
<div>{{patient.opd}}</div>
<div><b>Bimari:</b> {{patient.disease}}</div>
<div>Fee: ₹{{patient.amount}}</div>
<form method="post" action="/checkin/{{patient.id}}">
<button type="submit" style="background:#007bff;">🏥 Check In</button>
</form>
</div>
{% endif %}
</div>
</body>
</html>
