        var diseaseSelect = document.getElementById('disease');
        var opdBox = document.getElementById('opdBox');

        diseaseSelect.innerHTML = '<option value="">-- Bimari Chuno --</option>';
        opdBox.style.display = 'none';

        if(hospital && opdMap[hospital]) {
            diseaseSelect.disabled = false;
            diseases.forEach(function(d) {
                var opt = document.createElement('option');
                opt.value = d;
                opt.innerText = d;
                diseaseSelect.appendChild(opt);
            });
        } else {
            diseaseSelect.disabled = true;
            diseaseSelect.innerHTML = '<option value="">-- Pehle Hospital Chuno --</option>';
        }
    });

    document.getElementById('disease').addEventListener('change', function() {

        var opdBox = document.getElementById('opdBox');
        var opdText = document.getElementById('opdText');
        var opdHidden = document.getElementById('opdHidden');
        var diseaseHidden = document.getElementById('diseaseHidden');

            opdText.innerText = opd;
            opdHidden.value = opd;
            diseaseHidden.value = disease;
