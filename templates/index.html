<!DOCTYPE html>
<html>
<head>
    <title>Hospital Token</title>
    <style>
        body {font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px;}
        input {padding: 10px; margin: 5px; width: 100%;}
        button {padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer;}
       .patient {border: 1px solid #ddd; padding: 10px; margin: 5px 0;}
       .flash {background: #d4edda; padding: 10px; margin: 10px 0;}
    </style>
</head>
<body>
    <h2>🏥 Hospital Token System</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="name" placeholder="Patient ka naam" required>
        <input type="text" name="address" placeholder="Address" required>
        <button type="submit">Add Patient</button>
    </form>

    <h3>Patient List:</h3>
    {% for p in patients %}
        <div class="patient">
            <b>#{{ p.id }}</b> {{ p.name }} - {{ p.hospital_address }}
        </div>
    {% endfor %}

    <p><a href="/qr">QR Code</a></p>
</body>
</html>
