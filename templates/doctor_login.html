<!DOCTYPE html>
<html>
<head>
<title>Doctor Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#e8f4f8;padding:20px;font-family:Arial}
.box{background:white;padding:30px;border-radius:15px;max-width:350px;margin:100px auto;text-align:center;box-shadow:0 4px 10px #ccc}
input,button{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ddd;font-size:16px}
button{background:#28a745;color:white;border:none;font-weight:bold}
h2{color:#28a745}
small{color:gray}
</style>
</head>
<body>
<div class="box">
<h2>👨‍⚕️ Doctor Login</h2>
<form method="post">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<small>Demo: doctor / 1234</small>
</div>
</body>
</html>
